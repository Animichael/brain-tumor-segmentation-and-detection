services:
  - type: web
    name: neuroscan-ai
    runtime: python
    plan: standard # torch + transformers + ultralytics need real RAM — see DEPLOY.md
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash render-start.sh"
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neuroscan-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER_DISK_PATH
        value: /var/data
    disk:
      name: neuroscan-ai-data
      mountPath: /var/data
      sizeGB: 5

databases:
  - name: neuroscan-ai-db
    plan: free
    region: oregon
